const CELL_LABEL = {
  C: '<span class="cellpills"><span class="c">C</span><span class="r">R</span><span class="u">U</span><span class="d">D</span></span>',
  R: 'R',
  N: '–',
};

/* ---------- 아래부터는 렌더링 전용 코드입니다 (수정 불필요) ---------- */
(function(){
  const roleNames = Object.keys(PERMISSIONS);
  const t = document.getElementById('mtable');
  let h = '';
  h += '<thead><tr><th class="corner">Service</th>';
  roleNames.forEach((name, i) => h += `<th class="role" data-col="${i}">${name}</th>`);
  h += '</tr></thead><tbody>';
  for (const [cat, svcs] of Object.entries(SERVICE_CATEGORIES)) {
    h += `<tr class="catrow"><td class="cat">${cat}</td>` + roleNames.map((r, i) => `<td class="cat" data-col="${i}"></td>`).join('') + '</tr>';
    svcs.forEach(svc => {
      h += `<tr><td class="svc">${svc}</td>`;
      roleNames.forEach((name, i) => {
        const value = PERMISSIONS[name][svc];
        h += `<td class="${value.toLowerCase()}" data-col="${i}">${CELL_LABEL[value]}</td>`;
      });
      h += '</tr>';
    });
  }
  h += '</tbody>';
  t.innerHTML = h;
  t.querySelectorAll('th.role').forEach(th => {
    th.onclick = () => {
      const col = th.dataset.col;
      const on = th.classList.contains('hicol');
      t.querySelectorAll('.hicol').forEach(x => x.classList.remove('hicol'));
      if (!on) t.querySelectorAll('[data-col="' + col + '"]').forEach(x => x.classList.add('hicol'));
    };
  });
})();
</script>
